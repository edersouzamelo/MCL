name: mcl-intranet

services:
  postgres:
    image: postgres:16-alpine
    container_name: mcl-intranet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mcl_local}
      POSTGRES_USER: ${POSTGRES_USER:-mcl_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_BEFORE_START}
    volumes:
      - mcl_intranet_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcl_app} -d ${POSTGRES_DB:-mcl_local}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mcl_intranet

  app:
    image: mcl-intranet:local
    build:
      context: .
      dockerfile: Dockerfile.intranet
    container_name: mcl-intranet-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-mcl_app}:${POSTGRES_PASSWORD:-CHANGE_ME_BEFORE_START}@postgres:5432/${POSTGRES_DB:-mcl_local}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-mcl_app}:${POSTGRES_PASSWORD:-CHANGE_ME_BEFORE_START}@postgres:5432/${POSTGRES_DB:-mcl_local}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-CHANGE_ME_BEFORE_START}
      NEXTAUTH_URL: ${MCL_BASE_URL:-http://127.0.0.1:3000}
      NEXT_PUBLIC_APP_URL: ${MCL_BASE_URL:-http://127.0.0.1:3000}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-false}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
      MCL_ALLOW_MEMORY_FALLBACK: "false"
      MCL_COOKIE_SECURE: ${MCL_COOKIE_SECURE:-false}
      MCL_RUN_SEED: ${MCL_RUN_SEED:-false}
      MCL_REBUILD_ON_START: ${MCL_REBUILD_ON_START:-true}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      COMPRAS_GOV_API_BASE_URL: ${COMPRAS_GOV_API_BASE_URL:-https://dadosabertos.compras.gov.br}
      COMPRAS_GOV_SYNC_ENABLED: ${COMPRAS_GOV_SYNC_ENABLED:-false}
    ports:
      - "${MCL_HTTP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health/db').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    networks:
      - mcl_intranet

volumes:
  mcl_intranet_postgres:

networks:
  mcl_intranet:
    driver: bridge
